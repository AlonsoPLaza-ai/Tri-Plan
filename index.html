<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;



// ── Palette ──────────────────────────────────────────────────────────────────
const C = {
  bg: "#07090C", surface: "#0C1017", border: "#141C24",
  text: "#C8D8E8", muted: "#5A7080", dim: "#121A22",
  swim: "#12A08A", run: "#2E86D6", bike: "#C07800",
  gym: "#9048D0", brick: "#D05A10", rest: "#42545E",
  race: "#C8A030", ok: "#2FA86A", warn: "#C85A3A",
  p1: "#1290B4", p2: "#1E9A74", p3: "#A89400",
  p4: "#C03A3A", p5: "#7A52C0", p6: "#4E8A4E",
};

const TAG = (t) => ({
  swim: ["Swim", C.swim], run: ["Run", C.run], bike: ["Bike", C.bike],
  gym: ["Gym", C.gym], cali: ["Home", C.gym], brick: ["Brick", C.brick], rest: ["Rest", C.rest],
  race: ["Test", C.race], mob: ["Mobility", C.muted],
}[t] || [t, C.muted]);

// ── Athlete ──────────────────────────────────────────────────────────────────
const ATHLETE = {
  weight: 70, height: 177, age: 18, rhr: "57–60", hrMax: 200,
  z2: { run: "5:15/km", bike: "26 km/h", swim: "1:50/100 m", hr: "150–165 bpm · zone 1 sits under 150" },
  golden: { hr: "170–182 bpm", lactate: "2.3–3.0 mmol/L", run: "4:35–4:45/km", swim: "1:44/100 m", bike: "215 W race, ~275 W threshold" },
  prs: [
    ["5 km", "21:14", "4:14/km — the number everything is built from"],
    ["10 km", "48:00", "your 5 km predicts 44:16"],
    ["Half marathon", "1:51", "your 5 km predicts 1:37:40"],
    ["Swim 2 km", "1:52/100 m", "strong base, and swimming carries no injury cost"],
    ["Bike", "untested", "indoor only until you have a road bike"],
  ],
};

// ── Phase 1 — all thirteen weeks ─────────────────────────────────────────────
// Volume rises 3% per load week, drops to 65% in the deload, and the next block
// restarts at the previous block's final load week rather than above it.
const P1 = [
  { n: 1,  block: "Block 1", type: "load",   swim: 8.5,  bike: 240, sat: 165, run: 38, long: 11.0, hrs: "10:10", gym: "2 × 60 min", thr: [], out: true,
    note: "Technique and structure only, and the bike is outdoors from day one. Saturday opens at 2:45 and never drops below it again, with one easy ride on Monday morning. No threshold work in any discipline. Rønnestad and Mujika are explicit that the first weeks of a strength programme should sit alongside low-intensity endurance, and long zone 2 riding is exactly that: high aerobic load at almost no impact cost." },
  { n: 2,  block: "Block 1", type: "load",   swim: 8.8,  bike: 255, sat: 175, run: 39, long: 11.5, hrs: "10:36", gym: "2 × 60 min", thr: [], out: true,
    note: "Same shape, five more minutes on Saturday. Your legs will feel heavy from the gym this week and that is expected, not a warning sign. Hold the easy paces and the sub-150 heart rate even if they feel harder than last week." },
  { n: 3,  block: "Block 1", type: "load",   swim: 9.0,  bike: 270, sat: 185, run: 40, long: 12.0, hrs: "11:00", gym: "2 × 60 min", thr: ["swim"], out: true,
    note: "Swim threshold enters first, because swimming is the only discipline where threshold work carries essentially no injury cost. Monday afternoon with the team becomes 8 × 200 m at 1:44/100 m with 30 seconds rest. Saturday reaches 2:45, and carbohydrate from minute 30 is now standing procedure on every long ride." },
  { n: 4,  block: "Block 1", type: "deload", swim: 5.9,  bike: 175, sat: 120, run: 26, long: 8.0,  hrs: "7:15",  gym: "2 × 45 min", thr: [], out: true,
    note: "Volume to 65%. Gym drops to two working sets per exercise at the same load. Use this week to get the bike fitted and set up, so week 5 starts on a bike that already fits you rather than one you are still adjusting." },
  { n: 5,  block: "Block 2", type: "load",   swim: 9.0,  bike: 270, sat: 185, run: 40, long: 12.0, hrs: "11:00", gym: "2 × 60 min", thr: ["swim"], out: true,
    note: "Last week before the trainer changes the shape of the week. Saturday repeats week 3 at 3:05 rather than climbing, because week 6 adds both a midweek ride and bike threshold at once and you want to arrive at that fresh. Everything is still zone 2, heart rate 150 to 165, speed is not a target of any kind." },
  { n: 6,  block: "Block 2", type: "load",   swim: 9.3,  bike: 355, sat: 200, run: 41, long: 12.5, hrs: "12:36", gym: "2 × 60 min", thr: ["swim", "bike"], out: true,
    note: "The trainer arrives and the week changes shape. Saturday reaches 3:20 and grows by roughly 15 minutes a week from here to 4:30 in week 11. Bike threshold enters on Wednesday evening and stays indoors permanently: 3 × 8 minutes at 170–182 bpm with 3 minutes easy between. Controlling a thirteen-beat band on Navarran roads in November is not realistic, and the band is the whole point." },
  { n: 7,  block: "Block 2", type: "load",   swim: 9.6,  bike: 380, sat: 215, run: 43, long: 13.0, hrs: "13:17", gym: "2 × 60 min", thr: ["swim", "bike"], out: true,
    note: "3:15 on Saturday, and this is the ride where fuelling stops being a detail: 60 to 80 g of carbohydrate per hour, taken on the move, starting at minute 30 and never skipped. You are training the gut as deliberately as the legs, and the gut takes longer." },
  { n: 8,  block: "Block 2", type: "deload", swim: 6.2,  bike: 250, sat: 140, run: 28, long: 9.0,  hrs: "8:46",  gym: "2 × 45 min", thr: ["swim"], out: true,
    note: "Keep one short swim threshold set, cut everything else, Saturday back to two hours. Bakken's principle for reduced weeks is to preserve the threshold habit while stripping the volume, so the stimulus stays familiar." },
  { n: 9,  block: "Block 3", type: "load",   swim: 9.6,  bike: 400, sat: 230, run: 43, long: 13.0, hrs: "13:37", gym: "2 × 60 min", thr: ["swim", "bike", "run"], out: true,
    note: "Run threshold enters, eight weeks later than swimming, and it lands on the Tuesday team run: 6 × 1000 m at 4:40/km with 75 seconds jog. Until this week that Tuesday session stays easy no matter what the group does. Short reps keep lactate under 3 mmol even at a pace faster than half marathon pace. Saturday reaches 3:30." },
  { n: 10, block: "Block 3", type: "load",   swim: 9.9,  bike: 430, sat: 250, run: 44, long: 13.5, hrs: "14:18", gym: "2 × 60 min", thr: ["swim", "bike", "run"], out: true,
    note: "Four hours on Saturday, and three threshold sessions now sit across three disciplines, which is exactly how the Norwegian triathlon group structures it — never two in the same discipline on the same day. The long ride is already longer than your race bike leg will be, which is what a base phase is for." },
  { n: 11, block: "Block 3", type: "load",   swim: 10.2, bike: 455, sat: 270, run: 45, long: 13.5, hrs: "14:53", gym: "2 × 60 min", thr: ["swim", "bike", "run"], out: true,
    note: "Peak week of the phase and the longest ride in it: 4:30. Run threshold goes to 8 × 1000 m. Take Saturday onto a route with a real climb and treat holding zone 2 up it as the session's actual objective, not an inconvenience." },
  { n: 12, block: "Block 3", type: "deload", swim: 6.6,  bike: 300, sat: 175, run: 29, long: 9.0,  hrs: "9:48",  gym: "2 × 45 min", thr: ["swim"], out: true,
    note: "Final deload before testing, Saturday back to its 2:30 floor. Sleep is the session this week." },
  { n: 13, block: "Test",    type: "test",   swim: 8.0,  bike: 280, sat: 165, run: 36, long: 12.0, hrs: "10:31", gym: "2 × 45 min", thr: [], out: true,
    note: "Test week. Tuesday 1,000 m swim time trial, Thursday 40-minute maximum distance on the trainer, Sunday 10 km time trial replacing the long run. Saturday stays easy at 2:30. These three numbers set every pace in phase 2, so treat them as races." },
];

// Swim shares are fixed. Bike is split by taking the Saturday ride out first,
// then dividing the remainder across the three midweek trainer sessions, so the
// long ride can grow at its own rate without disturbing the weekly total.
const SWIM_SHARE = { mon: 0.38, wed: 0.34, fri: 0.28 };
const SWIM_FACTOR = 1.0; // three longer self-directed swims carry the full volume

const mmss = (sec) => `${Math.floor(sec / 60)}:${String(Math.round(sec % 60)).padStart(2, "0")}`;
// Easy pace is not prescribed, it is predicted: hold the heart rate band and
// this is roughly where the pace should land as aerobic fitness improves.
const easyRun = (n) => mmss(315 - (n - 1) * 1.5);
const easySwim = (n) => mmss(110 - (n - 1) * 0.6);
const easyBikeKmh = (n) => (26 + (n - 1) * 0.22).toFixed(1);
const r1 = (x) => Math.round(x * 10) / 10;
const rm = (x) => Math.round(x / 5) * 5;
const hm = (m) => (m >= 90 ? `${Math.floor(m / 60)}:${String(m % 60).padStart(2, "0")}` : `${m} min`);

function buildWeek(w) {
  const s = SWIM_SHARE;
  const rest = w.bike - w.sat;
  const trainer = w.n >= 6;
  const bMon = rm(rest * 0.52);
  const bWed = rm(rest * 0.48);
  const sw = w.swim * SWIM_FACTOR;
  const hasS = w.thr.includes("swim"), hasB = w.thr.includes("bike"), hasR = w.thr.includes("run");
  const test = w.type === "test";
  const out = w.out;
  const gymLen = w.type === "load" ? "60 min" : "45 min";
  const setNote = w.type === "load" ? "3 working sets" : "2 working sets, same load";

  const runTue = r1(w.run * 0.26), runWed = r1(w.run * 0.19);
  const runFri = r1(w.run * 0.21), runBrick = r1(w.run * 0.05);

  const easyBike = `zone 2 · about ${easyBikeKmh(w.n)} km/h · 150 to 165 bpm`;

  const swimThr = hasS
    ? (w.type === "deload" ? "5 × 200 m at 1:44/100 m · 30 s rest" : w.n >= 9 ? "10 × 200 m at 1:44/100 m · 30 s rest" : "8 × 200 m at 1:44/100 m · 30 s rest")
    : null;
  const bikeThr = hasB ? (w.n >= 9 ? "4 × 8 min at 170–182 bpm · 3 min easy" : "3 × 8 min at 170–182 bpm · 3 min easy") : null;
  const runThr = hasR ? (w.n >= 11 ? "8 × 1000 m at 4:40/km · 75 s jog" : "6 × 1000 m at 4:40/km · 75 s jog") : null;

  const fuel = " · 60 to 80 g of carbohydrate per hour from minute 30";
  const satText = `Outdoors · ${hm(w.sat)} · zone 2, heart rate 150 to 165 · ignore speed entirely${fuel}`;

  return [
    { d: "Mon", label: "Bike and strength", ses: [
      { h: "8:30 AM", t: "bike", x: `Bike ${bMon} min · ${easyBike} · your light class day, so this one goes outdoors as long as it is light` },
      { h: "11:00 AM", t: "gym",  x: `Day 2 · back, chest, core · ${gymLen} · upper body only, so Tuesday's run threshold stays untouched` },
    ] },
    { d: "Tue", label: hasR ? "Run threshold and swim" : "Aerobic", ses: [
      { h: "6:45 AM", t: "run",  x: runThr
          ? `Threshold · ${runThr} · 170–182 bpm · total ${runTue} km with warm-up`
          : `Run ${runTue} km easy · about ${easyRun(w.n)}/km at 150 to 160 bpm · hold the heart rate, let the pace come to you` },
      { h: "8:30 AM", t: "swim", x: swimThr
          ? `Threshold · ${swimThr} · plus warm-up and cool-down to ${r1(sw * s.mon)} km`
          : `Swim ${r1(sw * s.mon)} km · zone 2 at about ${easySwim(w.n)}/100 m · 30% technique drills` },
    ] },
    { d: "Wed", label: "Swim and legs", ses: [
      { h: "7:00 PM", t: "swim", x: `Swim ${r1(sw * s.wed)} km · zone 2 at about ${easySwim(w.n)}/100 m · continuous aerobic` },
      { h: "After", t: "gym", x: `Day 1 · legs · ${gymLen} · the only heavy leg session of the week` },
    ] },
    { d: "Thu", label: hasB ? "Bike threshold" : "Bike aerobic", ses: [
      { h: "7:00 PM", t: "bike", x: test
          ? `Test · 40 min maximum distance on the trainer after 15 min warm-up`
          : bikeThr
            ? `Threshold on the trainer · ${bikeThr} · total ${bWed} min · power first, heart rate second`
            : trainer
              ? `Bike ${bWed} min on the trainer · ${easyBike}`
              : `Bike ${bWed} min · ${easyBike} · daylight permitting, otherwise this one waits for the trainer` },
    ] },
    { d: "Fri", label: "Run, swim, strength", ses: [
      { h: "6:45 AM", t: "run",  x: `Run ${runFri} km easy · about ${easyRun(w.n)}/km at 150 to 160 bpm · short by design` },
      { h: "8:15 AM", t: "swim", x: test
          ? `Time trial · 1,000 m maximum effort · full warm-up first`
          : `Swim ${r1(sw * s.fri)} km · technique only, no set` },
      { h: "Evening", t: "gym",  x: `Day 3 · shoulders, arms, core · ${gymLen} · the lightest of the three, Saturday is tomorrow` },
    ] },
    { d: "Sat", label: out ? "Long ride outdoors and brick" : "Long ride and brick", ses: [
      { h: "9:00 AM", t: "bike", x: satText },
      { h: "Off the bike", t: "brick", x: `Straight off the bike · ${runBrick} km run · zone 2, not fast` },
    ] },
    { d: "Sun", label: test ? "10 km time trial" : "Long run", ses: [
      { h: "9:00 AM", t: test ? "race" : "run", x: test
          ? `Time trial · 10 km maximum effort · this sets every pace in phase 2`
          : `Long run ${w.long} km · 150 to 165 bpm · ${Math.round(w.long / w.run * 100)}% of the week's running` },
      { h: "After", t: "mob", x: `Mobility 20 min · Sunday review afterwards` },
    ] },
  ];
}

const METHOD = [
  { t: "The golden zone is 152 to 165 bpm for you", col: C.p1, b: "Bakken places threshold at 2.0 to 3.0 mmol of lactate, which is roughly 80 to 87 percent of maximum heart rate. With a maximum of 190 that is 152 to 165 bpm. Arild Tveiten, who coaches the Norwegian triathletes, finds their anaerobic threshold lands at 2.5 to 3.0 mmol rather than the 4.0 that most textbooks use. Bakken's instruction is to sit 0.3 to 0.5 mmol below threshold, not at it. Practically: every threshold session should end with you certain you could have done two more repetitions. If you cannot say that, the session was too hard and you have bought fatigue instead of adaptation." },
  { t: "In triathlon, double threshold means one session per discipline", col: C.p2, b: "This is the single most important correction in the whole plan. Tveiten, describing the Norwegian triathlon group: they do a lot of double threshold, but because they have three disciplines, it is always one session of each. Never two run thresholds in a day, never two swim thresholds. Your swim threshold sits on Monday with the team and your run threshold on Tuesday with the team, on consecutive days rather than the same one. That is fine, and it is fine for the same reason: consecutive quality in two disciplines loads different tissue. Thursday holds the bike threshold, which leaves Wednesday and Friday genuinely easy." },
  { t: "Threshold enters one discipline at a time", col: C.p3, b: "Swimming carries no impact and almost no injury risk, so swim threshold starts in week 3. Cycling carries no impact either, so bike threshold starts in week 5. Running is where injuries come from, so run threshold waits until week 9, and even then it arrives as short repetitions rather than continuous tempo. Short reps keep lactate below 3 mmol at paces faster than half marathon pace, because the repetition is too short for lactate to climb and the rest is long enough for it to fall back." },
  { t: "The long run is capped, and the cap is lower than you think", col: C.p4, b: "Bakken's own base week ran 180 km and his long run never exceeded 16 to 18 km. You are running 38 to 45 km a week, so your long run belongs at 11 to 14 km. The rule that actually protects you is that the long run never exceeds 30 percent of the week's running. Every long run in phase 1 is built to that rule, and the peak long run of the entire plan is 20 km in phase 4." },

const KEY = "tri703_final_v1";
const empty = { weeks: {}, lifts: {}, tests: [] };
let docRef = null;
const ready = (async () => {
  try {
    const db = await window.claude?.use?.("db");
    const user = await window.claude?.use?.("user");
    if (db && user) { const uid = await user.id(); if (uid) docRef = db.doc("data/users/" + uid + "/plan"); }
  } catch (e) {}
})();
const load = async () => {
  try { await ready; } catch (e) {}
  if (docRef) { try { const snap = await docRef.get(); if (snap.exists) return { ...empty, ...snap.data() }; } catch (e) {} }
  try { const raw = localStorage.getItem(KEY); if (raw) return { ...empty, ...JSON.parse(raw) }; } catch (e) {}
  return empty;
};
const save = async (d) => {
  try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) {}
  try { await ready; } catch (e) {}
  if (docRef) { try { await docRef.set(d); } catch (e) { return false; } }
  return true;
};

              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 10, flexWrap: "wrap", marginBottom: 10 }}>
                <div>
                  <Eyebrow col={typeColour}>Phase 1 · {W.block}</Eyebrow>
                  <div style={{ fontSize: 20, fontWeight: 700, color: "#EEE" }}>Week {W.n} of 13</div>
                  <div style={{ fontSize: 11.5, color: C.muted, marginTop: 3 }}>{W.hrs} endurance · plus {W.gym} in the gym</div>
                </div>
                <div style={{ background: typeColour + "22", border: `1px solid ${typeColour}55`, borderRadius: 6, padding: "5px 11px", fontSize: 11.5, color: typeColour, fontWeight: 600 }}>{typeLabel}</div>
              </div>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(4,1fr)", gap: 6, marginBottom: 10 }}>
                {[["Swim", `${W.swim} km`, C.swim], ["Bike", `${Math.floor(W.bike / 60)}h ${W.bike % 60}m`, C.bike], ["Run", `${W.run} km`, C.run], ["Long run", `${W.long} km`, C.brick]].map(([k, v, c]) => (
                  <div key={k} style={{ background: "#0A1218", borderRadius: 8, padding: "9px 10px", border: `1px solid ${c}22` }}>
                    <div style={{ fontSize: 10.5, color: C.muted }}>{k}</div>
                    <div style={{ fontSize: 15, fontWeight: 700, color: c, marginTop: 2 }}>{v}</div>
                  </div>
                ))}
              </div>
              <div style={{ fontSize: 12, color: "#8AA8B8", lineHeight: 1.65 }}>{W.note}</div>
              {W.thr.length > 0 && (
                <div style={{ marginTop: 10, fontSize: 11.5, color: typeColour }}>
                  Threshold this week: {W.thr.map((t) => TAG(t)[0].toLowerCase()).join(", ")} · all of it at 152 to 165 bpm
                </div>
              )}
            </Card>

            {W.n >= 4 && W.n <= 7 && (
              <Card style={{ background: "#1A0F04", border: `1px solid ${C.brick}55` }}>
                <Eyebrow col={C.brick}>Road bike from week 5</Eyebrow>
                <div style={{ fontSize: 12, color: "#D6A87A", lineHeight: 1.7 }}>
                  {W.n === 4 && "Fit the bike this week, not next. A professional fit before the first real ride is worth more than any component on it, and a position error takes about ten days to turn into knee pain. Ride it once or twice easy, thirty minutes, just to find out what needs moving."}
                  {W.n === 5 && "Saturday is 2:45 outdoors, the same as week 3 indoors. The duration is deliberately unchanged because it is not the new thing — the position, the road surface, the descending and the handling all are. Rolling roads only. No climbs, no group, no Strava segments. If your knees or your neck complain, that is a fit problem and it gets solved before week 6, not after."}
                  {W.n === 6 && "Three hours, fifteen minutes longer than last week, and that is the rate for the rest of the phase up to 4:30 in week 11. Bike threshold starts today and lives on the trainer for good: holding 152 to 165 bpm through junctions and descents is not realistic, and the narrow band is the entire mechanism."}
                  {W.n === 7 && "3:15, which is long enough that fuelling is now training rather than logistics. Take 60 to 80 g of carbohydrate an hour, starting at minute 30, and take it while moving. The gut adapts more slowly than the legs and it needs the full eighteen months."}
                </div>
              </Card>
            )}

            {days.map((d, i) => <DayBlock key={i} d={d} />)}

            <Card style={{ marginTop: 12 }}>
              <Eyebrow>Volume across the phase</Eyebrow>
              <div style={{ overflowX: "auto" }}>
                <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 11.5, minWidth: 480 }}>
                  <thead>
                    <tr style={{ borderBottom: `2px solid ${C.border}` }}>
                      {["Week", "Type", "Swim", "Bike", "Sat ride", "Run", "Long", "Hours"].map((h, i) => (
                        <th key={h} style={{ padding: "8px 6px", textAlign: i === 0 ? "left" : "center", fontSize: 9.5, fontWeight: 700, letterSpacing: "0.06em", color: C.muted }}>{h}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {P1.map((w, i) => {
                      const c = w.type === "deload" ? C.ok : w.type === "test" ? C.race : C.text;
                      return (
                        <tr key={w.n} onClick={() => setWk(i)} style={{ borderBottom: `1px solid ${C.border}`, cursor: "pointer", background: wk === i ? "#101A24" : "transparent" }}>
                          <td style={{ padding: "8px 6px", fontWeight: 700, color: c }}>{w.n}</td>
                          <td style={{ padding: "8px 6px", textAlign: "center", color: C.muted, fontSize: 10.5 }}>{w.type}</td>
                          <td style={{ padding: "8px 6px", textAlign: "center", color: C.swim }}>{w.swim}</td>
                          <td style={{ padding: "8px 6px", textAlign: "center", color: C.bike }}>{Math.floor(w.bike / 60)}h{String(w.bike % 60).padStart(2, "0")}</td>
                          <td style={{ padding: "8px 6px", textAlign: "center", color: w.out ? C.brick : C.muted, fontWeight: w.out ? 600 : 400 }}>{hm(w.sat)}{w.out ? " out" : ""}</td>
                          <td style={{ padding: "8px 6px", textAlign: "center", color: C.run }}>{w.run}</td>
                          <td style={{ padding: "8px 6px", textAlign: "center", color: C.brick }}>{w.long}</td>
                          <td style={{ padding: "8px 6px", textAlign: "center", color: C.text }}>{w.hrs}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
              <div style={{ fontSize: 11.5, color: C.muted, lineHeight: 1.6, marginTop: 10 }}>
                Every load week adds 3%. Deloads drop to 65% of the week before them. Each block restarts where the last one finished rather than above it, which is what keeps thirteen weeks of 3% from compounding into something unsurvivable. If your current running is below 35 km a week, scale every run number by the ratio and keep the shape.
              </div>
            </Card>
          </div>
        )}

        {/* Later phases */}
        {tab === "later" && (
          <div>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(5,1fr)", gap: 4, marginBottom: 12 }}>
              {PHASES.slice(1).map((p) => (
                <button key={p.id} onClick={() => setPh(p.id)} style={{ background: ph === p.id ? p.col : p.col + "18", border: `1px solid ${ph === p.id ? p.col : p.col + "44"}`, borderRadius: 7, padding: "9px 4px", cursor: "pointer", textAlign: "center" }}>
                  <div style={{ fontSize: 11, fontWeight: 700, color: ph === p.id ? "#FFF" : p.col }}>Phase {p.id}</div>
                  <div style={{ fontSize: 9, color: ph === p.id ? "rgba(255,255,255,0.6)" : C.muted, marginTop: 2 }}>{p.gym} gym</div>
                </button>
              ))}
            </div>

            {(() => {
              const P = PHASES.find((x) => x.id === ph);
              return (
                <>
                  <Card style={{ border: `1px solid ${P.col}55` }}>
                    <Eyebrow col={P.col}>Phase {P.id} · {P.weeks} weeks · {P.dates}</Eyebrow>
                    <div style={{ fontSize: 19, fontWeight: 700, color: "#EEE", marginBottom: 4 }}>{P.name}</div>
                    <div style={{ fontSize: 12, color: "#8AA8B8", lineHeight: 1.65, marginBottom: 10 }}>{P.focus}</div>
                    <div style={{ display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: 6, marginBottom: 10 }}>
                      {[["Swim", P.swimTarget, C.swim], ["Run", P.runTarget, C.run], ["Bike", P.bikeTarget, C.bike]].map(([k, v, c]) => (
                        <div key={k} style={{ background: "#0A1218", borderRadius: 8, padding: "8px 10px", border: `1px solid ${c}22` }}>
                          <div style={{ fontSize: 10.5, color: C.muted }}>{k}</div>
                          <div style={{ fontSize: 14, fontWeight: 700, color: c, marginTop: 2 }}>{v}</div>
                        </div>
                      ))}
                    </div>
                    <div style={{ background: P.col + "15", borderRadius: 8, padding: "9px 12px" }}>
                      <Eyebrow col={P.col}>Key session</Eyebrow>
                      <div style={{ fontSize: 12, color: C.text, lineHeight: 1.5 }}>{P.key}</div>
                    </div>
                  </Card>
                  <div style={{ fontSize: 11.5, color: C.muted, marginBottom: 10 }}>One representative load week. The full thirteen weeks get written when you finish phase 1 and we have your test numbers.</div>
                  {OTHER_WEEKS[ph].map((d, i) => <DayBlock key={i} d={d} />)}
                </>
              );
            })()}
          </div>
        )}

        {/* Gym */}
        {tab === "gym" && (
          <div>
            <Card style={{ background: "#100820", border: `1px solid ${C.gym}44` }}>
              <div style={{ fontSize: 13, fontWeight: 600, color: C.gym, marginBottom: 6 }}>Three full-body sessions, each followed by a bike or a swim</div>
              <div style={{ fontSize: 12, color: "#B0A0C8", lineHeight: 1.65 }}>
                Sets and rest come from Rønnestad and Mujika: four to ten repetitions, two to three sets, two to three minutes between sets. The rest periods are the part people cut and the part that makes it work. Lifting moved to the morning, straight after the easy endurance session, because the team owns your afternoons. Endurance first, lifting second, then at least six hours before the evening swim.
              </div>
            </Card>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: 6, marginBottom: 14 }}>
              {Object.values(GYM).map((s) => {
                const on = gym === s.id;
                return (
                  <button key={s.id} onClick={() => setGym(s.id)} style={{ background: on ? s.col : C.surface, border: `1px solid ${on ? s.col : C.border}`, borderRadius: 10, padding: "11px 10px", cursor: "pointer", textAlign: "left" }}>
                    <div style={{ fontSize: 10, fontWeight: 700, color: on ? "rgba(255,255,255,0.65)" : C.muted, marginBottom: 3 }}>{s.day}</div>
                    <div style={{ fontSize: 13, fontWeight: 600, color: on ? "#FFF" : "#9AB8C8" }}>{s.name}</div>
                    <div style={{ fontSize: 10, color: on ? "rgba(255,255,255,0.55)" : C.muted, marginTop: 2 }}>{s.emph}</div>
                  </button>
                );
              })}
            </div>
            <Card style={{ border: `1px solid ${G.col}44` }}>
              <div style={{ fontSize: 12, color: "#9AB8C8", lineHeight: 1.6, marginBottom: 12 }}>{G.note}</div>
              {G.ex.map((ex) => <ExRow key={ex.n} ex={ex} col={G.col} last={lastLift(ex.n)} onLog={(w, r) => logLift(ex.n, w, r)} />)}
            </Card>
          </div>
        )}

        {/* Method */}
        {tab === "method" && (
          <div>
            {METHOD.map((m, i) => (
              <div key={i} style={{ background: C.surface, border: `1px solid ${m.col}33`, borderRadius: 12, padding: 14, marginBottom: 8 }}>
                <div style={{ fontSize: 13, fontWeight: 600, color: m.col, marginBottom: 7 }}>{m.t}</div>
                <div style={{ fontSize: 12, color: "#8AA8B8", lineHeight: 1.7 }}>{m.b}</div>
              </div>
            ))}
          </div>
        )}

        {/* Targets */}
        {tab === "targets" && (
          <div>
            <Card>
              <Eyebrow>Your two intensities</Eyebrow>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                <div style={{ background: "#0A1218", borderRadius: 10, padding: 12, border: `1px solid ${C.p2}33` }}>
                  <div style={{ fontSize: 12.5, fontWeight: 700, color: C.p2, marginBottom: 6 }}>Easy · under 155 bpm</div>
                  <div style={{ fontSize: 11.5, color: C.text, lineHeight: 1.7 }}>
                    Run {ATHLETE.z2.run}<br />Bike {ATHLETE.z2.bike}<br />Swim {ATHLETE.z2.swim}
                  </div>
                  <div style={{ fontSize: 11, color: C.muted, marginTop: 7, lineHeight: 1.5 }}>Measured at 140 bpm running 5:30/km, which is where it should be.</div>
                </div>
                <div style={{ background: "#0A1218", borderRadius: 10, padding: 12, border: `1px solid ${C.race}33` }}>
                  <div style={{ fontSize: 12.5, fontWeight: 700, color: C.race, marginBottom: 6 }}>Golden zone · {ATHLETE.golden.hr}</div>
                  <div style={{ fontSize: 11.5, color: C.text, lineHeight: 1.7 }}>
                    Run {ATHLETE.golden.run}<br />Swim {ATHLETE.golden.swim}<br />Lactate {ATHLETE.golden.lactate}
                  </div>
                  <div style={{ fontSize: 11, color: C.muted, marginTop: 7, lineHeight: 1.5 }}>Sit just below threshold, never on it. Two repetitions left in the tank at the end.</div>
                </div>
              </div>
            </Card>

            <Card>
              <Eyebrow>Where you are starting</Eyebrow>
              {ATHLETE.prs.map((r, i) => (
                <div key={i} style={{ padding: "8px 0", borderTop: i ? `1px solid ${C.border}` : "none" }}>
                  <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12 }}>
                    <span style={{ fontWeight: 600 }}>{r[0]}</span><span style={{ color: C.p1 }}>{r[1]}</span>
                  </div>
                  <div style={{ fontSize: 11, color: C.muted, marginTop: 2 }}>{r[2]}</div>
                </div>
              ))}
            </Card>

            <Card>
              <Eyebrow>Phase targets</Eyebrow>
              <div style={{ overflowX: "auto" }}>
                <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 11.5, minWidth: 520 }}>
                  <thead><tr style={{ borderBottom: `2px solid ${C.border}` }}>
                    {["Metric", "Now", "P1", "P2", "P3", "P4", "P5", "Race"].map((h, i) => (
                      <th key={h} style={{ padding: 8, textAlign: i === 0 ? "left" : "center", fontSize: 9.5, fontWeight: 700, color: i === 7 ? C.race : C.muted }}>{h}</th>
                    ))}
                  </tr></thead>
                  <tbody>
                    {[
                      ["Swim per 100 m", "1:52", "1:44", "1:38", "1:32", "1:25", "1:21", "1:20"],
                      ["Swim 1.9 km", "35:48", "33:04", "31:00", "29:00", "26:45", "25:40", "25:20"],
                      ["Bike pace", "~25 km/h", "27", "29", "32", "34", "35", "36 km/h"],
                      ["Bike 90 km", "3:36", "3:20", "3:06", "2:49", "2:39", "2:34", "2:30"],
                      ["Run per km", "5:29", "5:05", "4:52", "4:38", "4:24", "4:18", "4:16"],
                      ["Half marathon", "1:56", "1:47", "1:42", "1:37", "1:32", "1:30", "1:30"],
                      ["70.3 total", "~5:15", "~4:55", "~4:42", "~4:22", "~4:06", "~4:00", "4:00–4:45"],
                      ["Gym days per week", "3", "3", "3", "3", "2", "2", "1"],
                    ].map((r, i) => (
                      <tr key={i} style={{ borderBottom: `1px solid ${C.border}` }}>
                        <td style={{ padding: "9px 8px", fontWeight: 600, whiteSpace: "nowrap" }}>{r[0]}</td>
                        {r.slice(1).map((v, j) => (
                          <td key={j} style={{ padding: "9px 8px", textAlign: "center", fontWeight: j === 6 ? 700 : 400, color: j === 6 ? C.race : j === 0 ? C.muted : [C.p1, C.p2, C.p3, C.p4, C.p5][j - 1] || C.text }}>{v}</td>
                        ))}
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </Card>
          </div>
        )}

        {/* Sunday review */}
        {tab === "review" && (
          <div>
            <Card style={{ background: "#0D1E30", border: `1px solid ${C.p1}44` }}>
              <div style={{ fontSize: 13, fontWeight: 600, color: "#5AAEE0", marginBottom: 6 }}>Reviewing week {W.n}</div>
              <div style={{ fontSize: 12, color: "#7A9AB8", lineHeight: 1.65 }}>Enter what you actually did, not what was written. Then compare against week {nextW.n} below and decide whether to take it, repeat, or cut.</div>
            </Card>
            <Card>
              <Eyebrow>What you did</Eyebrow>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(4,1fr)", gap: 8, marginBottom: 10 }}>
                {[["swim", "Swim km"], ["bike", "Bike hours"], ["run", "Run km"], ["hours", "Total hours"]].map(([k, l]) => (
                  <div key={k}><div style={{ fontSize: 10.5, color: C.muted, marginBottom: 4 }}>{l}</div>
                    <input value={form[k]} onChange={(e) => setForm({ ...form, [k]: e.target.value })} inputMode="decimal" style={input} /></div>
                ))}
              </div>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: 8, marginBottom: 10 }}>
                {[["rhr", "Avg resting bpm"], ["sleep", "Avg sleep hours"], ["feel", "How it felt, 1 to 5"]].map(([k, l]) => (
                  <div key={k}><div style={{ fontSize: 10.5, color: C.muted, marginBottom: 4 }}>{l}</div>
                    <input value={form[k]} onChange={(e) => setForm({ ...form, [k]: e.target.value })} inputMode="decimal" style={input} /></div>
                ))}
              </div>
              <input value={form.txt} onChange={(e) => setForm({ ...form, txt: e.target.value })} placeholder="Anything that hurt, any session you cut, anything that surprised you" style={{ ...input, marginBottom: 10 }} />
              <button onClick={saveWeek} style={{ background: C.p1, border: "none", borderRadius: 7, color: "#FFF", fontSize: 12, fontWeight: 600, padding: "9px 16px", cursor: "pointer" }}>Save week {W.n}</button>
            </Card>

            <Card style={{ border: `1px solid ${nextW.type === "deload" ? C.ok : C.p2}55` }}>
              <Eyebrow col={nextW.type === "deload" ? C.ok : C.p2}>Week {nextW.n} is a {nextW.type} week</Eyebrow>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(4,1fr)", gap: 8, marginTop: 4 }}>
                {[["Swim", `${nextW.swim} km`], ["Bike", `${Math.floor(nextW.bike / 60)}h${String(nextW.bike % 60).padStart(2, "0")}`], ["Run", `${nextW.run} km`], ["Long run", `${nextW.long} km`]].map(([k, v]) => (
                  <div key={k} style={{ background: C.dim, borderRadius: 8, padding: "9px 10px" }}>
                    <div style={{ fontSize: 10.5, color: C.muted }}>{k}</div>
                    <div style={{ fontSize: 15, fontWeight: 700, color: nextW.type === "deload" ? C.ok : C.p2, marginTop: 2 }}>{v}</div>
                  </div>
                ))}
              </div>
              <div style={{ fontSize: 11.5, color: C.muted, lineHeight: 1.65, marginTop: 10 }}>
                Repeat this week instead of advancing if your resting rate ran 7 bpm above normal, if you rated the week a 1 or 2, if you cut more than two sessions, or if anything hurt in a way that changed how you moved. None of those are failures. Advancing on top of them is.
              </div>
            </Card>

            {Object.keys(data.weeks).length > 0 && (
              <Card>
                <Eyebrow>Logged weeks</Eyebrow>
                {Object.entries(data.weeks).sort().map(([k, v]) => (
                  <div key={k} style={{ borderTop: `1px solid ${C.border}`, padding: "8px 0", fontSize: 12, lineHeight: 1.5 }}>
                    <span style={{ color: C.muted, marginRight: 10 }}>{k}</span>
                    {v.swim && <span style={{ color: C.swim, marginRight: 10 }}>{v.swim} km swim</span>}
                    {v.bike && <span style={{ color: C.bike, marginRight: 10 }}>{v.bike} h bike</span>}
                    {v.run && <span style={{ color: C.run, marginRight: 10 }}>{v.run} km run</span>}
                    {v.rhr && <span style={{ color: C.muted, marginRight: 10 }}>{v.rhr} bpm</span>}
                    {v.feel && <span style={{ color: C.muted }}>felt {v.feel}/5</span>}
                    {v.txt && <div style={{ fontSize: 11.5, color: C.muted, marginTop: 2 }}>{v.txt}</div>}
                  </div>
                ))}
              </Card>
            )}
          </div>
        )}
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
