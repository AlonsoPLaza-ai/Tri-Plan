<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Asunción">
<meta name="theme-color" content="#07090C">
<title>Asunción 70.3</title>
<style>
  :root{
    color-scheme:dark;
    --bg:#07090C; --surface:#0C1017; --border:#141C24; --dim:#111922;
    --text:#C8D8E8; --muted:#5A7080; --faint:#3A4A58;
    --swim:#12A08A; --bike:#C07800; --run:#2E86D6; --gym:#8B5CF6;
    --brick:#C8A030; --test:#C85A3A; --ok:#3FA86B;
  }
  *,*::before,*::after{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:calc(env(safe-area-inset-bottom,0px) + 40px);
    overflow-x:hidden;-webkit-tap-highlight-color:transparent;line-height:1.5;}
  .wrap{max-width:760px;margin:0 auto;padding:0 16px;}

  header{padding:16px 0 10px;}
  .race{font-size:16px;font-weight:800;letter-spacing:-.01em;}
  .sub{font-size:11.5px;color:var(--muted);margin-top:4px;}
  .sub b{color:var(--brick);font-weight:700;}

  nav{display:flex;overflow-x:auto;gap:2px;border-bottom:1px solid var(--border);
    position:sticky;top:0;background:var(--bg);z-index:10;margin-bottom:13px;scrollbar-width:none;}
  nav::-webkit-scrollbar{display:none;}
  nav button{flex:0 0 auto;padding:12px 13px;font-size:12px;font-weight:600;background:none;
    border:none;border-bottom:2px solid transparent;color:var(--muted);cursor:pointer;
    font-family:inherit;white-space:nowrap;}
  nav button.on{color:#6BB8E8;border-bottom-color:#6BB8E8;}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;
    padding:14px;margin-bottom:10px;}
  .eyebrow{font-size:9.5px;font-weight:700;letter-spacing:.13em;color:var(--muted);
    margin-bottom:9px;text-transform:uppercase;}
  h3{margin:0 0 7px;font-size:13.5px;font-weight:700;}
  p{margin:0 0 9px;font-size:12.5px;color:#9FB3C4;}
  p:last-child{margin-bottom:0;}
  p b{color:var(--text);font-weight:600;}
  .note{font-size:11.5px;color:#8498A8;line-height:1.65;}

  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin;}
  table{width:100%;border-collapse:collapse;font-size:11.5px;}
  th{text-align:left;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--muted);font-weight:700;padding:0 8px 7px 0;border-bottom:1px solid var(--border);
    white-space:nowrap;}
  td{padding:8px 8px 8px 0;border-bottom:1px solid var(--dim);font-variant-numeric:tabular-nums;
    white-space:nowrap;}
  tr:last-child td{border-bottom:none;}
  td.r,th.r{text-align:right;padding-right:0;}
  .big{font-weight:700;color:var(--text);}
  tr.dl td{color:#6E8294;} tr.ts td{color:#C89A80;}

  .wsel{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none;}
  .wsel::-webkit-scrollbar{display:none;}
  .wsel button{flex:0 0 auto;min-width:54px;padding:9px 6px;border-radius:9px;
    background:var(--dim);border:1px solid var(--border);color:var(--muted);
    font-family:inherit;cursor:pointer;text-align:center;}
  .wsel button .wn{font-size:13px;font-weight:700;display:block;}
  .wsel button .wt{font-size:8.5px;letter-spacing:.05em;text-transform:uppercase;margin-top:2px;display:block;}
  .wsel button.on{background:#17222D;border-color:#2E4A60;color:var(--text);}

  .day{background:var(--surface);border:1px solid var(--border);border-radius:12px;
    padding:12px 13px;margin-bottom:8px;}
  .dhead{display:flex;align-items:baseline;gap:9px;margin-bottom:8px;}
  .dname{font-size:12.5px;font-weight:700;}
  .dlabel{font-size:10.5px;color:var(--muted);}
  .ses{display:flex;gap:9px;padding:8px 0;align-items:flex-start;}
  .ses + .ses{border-top:1px solid var(--dim);}
  .hh{font-size:9.5px;font-weight:700;color:var(--faint);min-width:50px;flex-shrink:0;padding-top:3px;}
  .pill{font-size:8.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    padding:3px 6px;border-radius:5px;flex-shrink:0;margin-top:1px;color:#07090C;}
  .sbody{flex:1;min-width:0;}
  .stitle{font-size:12px;font-weight:600;line-height:1.45;}
  .starg{font-size:11px;margin-top:4px;font-variant-numeric:tabular-nums;}
  .starg span{display:inline-block;margin-right:12px;}
  .starg .lab{color:var(--faint);font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;}
  .scue{font-size:10.5px;color:var(--muted);margin-top:4px;line-height:1.5;}

  .ex{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--dim);align-items:baseline;}
  .ex:last-child{border-bottom:none;}
  .exn{font-size:12px;font-weight:600;}
  .exs{font-size:11px;color:var(--brick);font-variant-numeric:tabular-nums;white-space:nowrap;}
  .exc{font-size:10.5px;color:var(--muted);margin-top:3px;line-height:1.5;}

  .kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;
    border-bottom:1px solid var(--dim);font-size:12px;}
  .kv:last-child{border-bottom:none;}
  .kv .k{color:var(--muted);}
  .kv .v{font-weight:600;font-variant-numeric:tabular-nums;text-align:right;}

  .hide{display:none;}
  .flag{border-left:2px solid var(--test);padding-left:10px;}
  .win{border-left:2px solid var(--ok);padding-left:10px;}
  .chk{border-left:2px solid var(--brick);padding-left:10px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="race">Ironman 70.3 Asunción</div>
    <div class="sub">Sunday 11 July 2027 · flat course, river swim · <b id="cd"></b></div>
  </header>

  <nav>
    <button data-t="week" class="on">Week</button>
    <button data-t="prog">Progression</button>
    <button data-t="phase">Phase 1</button>
    <button data-t="target">Targets</button>
    <button data-t="gym">Gym</button>
    <button data-t="method">Method</button>
  </nav>

  <section id="week"></section>
  <section id="prog" class="hide"></section>
  <section id="phase" class="hide"></section>
  <section id="target" class="hide"></section>
  <section id="gym" class="hide"></section>
  <section id="method" class="hide"></section>
</div>

<script>
(function () {
  "use strict";

  var COL = { swim:"var(--swim)", bike:"var(--bike)", run:"var(--run)", gym:"var(--gym)",
              brick:"var(--brick)", test:"var(--test)", mob:"var(--muted)" };

  function mmss(s){ return Math.floor(s/60) + ":" + String(Math.round(s%60)).padStart(2,"0"); }
  function hm(m){ return m >= 90 ? Math.floor(m/60) + ":" + String(m%60).padStart(2,"0") : m + " min"; }
  function r1(x){ return (Math.round(x*10)/10).toFixed(1); }

  // ── week-by-week progressions ──────────────────────────────────────────
  // Paces are PREDICTIONS at a fixed heart rate, not instructions.
  var FTP0 = 250;                                   // provisional until the week-3 test
  function ftp(n){ return Math.round(FTP0 + (n-3)*2.8); }
  function easyRun(n){ return mmss(318 - (n-3)*2.0); }   // 5:18 → 5:00
  function longRun(n){ return mmss(328 - (n-3)*2.0); }   // 5:28 → 5:10
  function swimAer(n){ return mmss(135 - (n-3)*1.45); }  // 2:15 → 2:02
  var RUN_THR  = { 8:"4:25", 10:"4:22", 11:"4:20" };
  var SWIM_THR = { 5:"2:00", 6:"2:00", 7:"1:59", 8:"1:58", 9:"1:58", 10:"1:56", 11:"1:55" };
  var SWIM_SET = { 5:"8 × 100 m · 20 s rest", 6:"6 × 100 m · 20 s rest",
                   7:"6 × 200 m · 25 s rest", 8:"5 × 300 m · 30 s rest",
                   9:"6 × 100 m · 20 s rest", 10:"6 × 200 m · 25 s rest",
                   11:"5 × 400 m · 40 s rest" };
  var BIKE_SET = { 7:"3 × 8 min · 3 min easy", 8:"4 × 8 min · 3 min easy",
                   9:"2 × 8 min · 3 min easy", 10:"3 × 10 min · 3 min easy",
                   11:"4 × 10 min · 3 min easy" };
  var RUN_SET  = { 8:"5 × 1000 m · 90 s jog", 10:"5 × 1000 m · 90 s jog", 11:"6 × 1000 m · 90 s jog" };

  function easyW(n){ var f=ftp(n); return Math.round(f*0.60/5)*5 + "–" + Math.round(f*0.68/5)*5 + " W"; }
  function thrW(n){ var f=ftp(n); return Math.round(f*0.95/5)*5 + "–" + f + " W"; }

  // ── weeks 3–12 ─────────────────────────────────────────────────────────
  var WEEKS = [
    { n:3, type:"load", dates:"9 – 15 Nov", swim:7.5, bike:[55,55,120], run:[12,8,8,3], gym:50, gymN:3, hrs:"11:34",
      note:"Baseline week, and the one job that matters is the FTP test on Thursday. Every watt in this plan is a guess until that number exists. Swims are technique-dominant from today — nobody has ever looked at your stroke, and that is the largest block of free time on the table. Film yourself this week, side-on and front-on, 25 m of normal swimming." },
    { n:4, type:"load", dates:"16 – 22 Nov", swim:8.0, bike:[60,60,135], run:[12,9,9,3], gym:55, gymN:3, hrs:"12:34",
      note:"Zones are real now. Every easy session sits at 150 to 160 bpm and you ignore pace entirely. On the bike, start holding the aero position in blocks of 10 minutes even on the trainer — position is a trainable skill and it takes months." },
    { n:5, type:"load", dates:"23 – 29 Nov", swim:8.5, bike:[65,65,150], run:[13,9,9,4], gym:55, gymN:3, hrs:"13:20",
      note:"Swim threshold enters first, because swimming is the only discipline where hard work carries no impact cost. Nothing else changes this week." },
    { n:6, type:"deload", dates:"30 Nov – 6 Dec", swim:5.5, bike:[45,45,90], run:[9,6,7,2], gym:40, gymN:3, hrs:"8:57",
      note:"Volume to 65%, gym to two working sets at the same load. Keep one short swim threshold set — Bakken's rule for reduced weeks is to strip volume, not the stimulus. First checkpoint: easy running should be around 5:12/km at 155 bpm." },
    { n:7, type:"load", dates:"7 – 13 Dec", swim:9.0, bike:[70,70,165], run:[13,9,10,4], gym:55, gymN:3, hrs:"14:00",
      note:"Bike threshold enters on Thursday and lives on the trainer permanently. Controlling a thirteen-beat band on Navarran roads in December is not realistic, and the band is the entire mechanism." },
    { n:8, type:"load", dates:"14 – 20 Dec", swim:9.5, bike:[70,75,185], run:[14,10,10,4], gym:55, gymN:3, hrs:"14:46",
      note:"Run threshold enters, as short repetitions rather than continuous tempo. Short reps keep lactate under 3 mmol at a pace faster than half-marathon pace. This is earlier than ideal — see the compressed-calendar note in Method." },
    { n:9, type:"deload", dates:"21 – 27 Dec", swim:6.0, bike:[50,45,100], run:[10,6,7,3], gym:40, gymN:3, hrs:"9:32",
      note:"Christmas, deliberately placed so the week you control least asks least of you. Keep the swim threshold, drop the run threshold entirely, and do not try to make this week up afterwards. Checkpoint: easy running around 5:06/km at 155 bpm." },
    { n:10, type:"load", dates:"28 Dec – 3 Jan", swim:8.0, bike:[60,60,140], run:[12,9,9,3], gym:50, gymN:2, hrs:"11:34",
      note:"Travel-flexible. Two gym sessions instead of three, and if the long ride ends up on a trainer in someone's garage, that is fine." },
    { n:11, type:"load", dates:"4 – 10 Jan", swim:10.0, bike:[75,80,220], run:[14,9,11,4], gym:55, gymN:3, hrs:"15:41",
      note:"Peak week and the first time you touch 15 to 16 hours. Saturday is 3:40. Three threshold sessions now sit across three disciplines — never two in one discipline on the same day, which is exactly how the Norwegian triathlon group structures it." },
    { n:12, type:"test", dates:"11 – 17 Jan", swim:7.0, bike:[60,75,120], run:[11,6,12,0], gym:45, gymN:2, hrs:"10:38",
      note:"Test week. Three numbers set every pace, power and heart rate in phase 2, so treat them as races rather than sessions. Targets: 1,000 m in 19:10, FTP 275 W, 10 km in 40:30." },
  ];

  // ── session builder ────────────────────────────────────────────────────
  function buildWeek(w){
    var n = w.n, test = w.type === "test", dl = w.type === "deload";
    var sets = (dl || test) ? "2 working sets" : "3 working sets";
    var sw = w.swim, s1 = r1(sw*0.36), s2 = r1(sw*0.36), s3 = r1(sw*0.28);
    var sThr = SWIM_THR[n], bSet = BIKE_SET[n], rThr = RUN_THR[n];

    function S(h,t,title,targets,cue){ return {h:h,t:t,title:title,targets:targets,cue:cue}; }

    var mon = [
      S("7:00 AM","bike","Aerobic ride · " + hm(w.bike[0]),
        [["Power",easyW(n)],["Heart rate","150–165"]],
        "Hold the aero position in blocks of 10 min. Cadence 85–95."),
      S("2:00 PM","gym","Day 2 · back, chest, core · " + w.gym + " min",
        [["Load","4–10 reps"],["Sets",sets]],
        "Upper body only, so tomorrow's run is untouched. Never to failure."),
      S("3:45 PM","swim","Technique swim · " + s1 + " km",
        [["Pace",swimAer(n) + "/100 m"],["Drills","40%"]],
        "This is a technique session that happens to be aerobic. Catch and body position, not fitness."),
    ];

    var tue = [ rThr
      ? S("7:00 AM","run","Run threshold · " + RUN_SET[n],
          [["Pace",rThr + "/km"],["Heart rate","170–182"],["Total",w.run[0] + " km"]],
          "Warm up 3 km, cool down 2 km. If the pace needs the heart rate above 182, the pace is wrong, not the band.")
      : S("7:00 AM","run","Easy run · " + w.run[0] + " km",
          [["Pace","≈ " + easyRun(n) + "/km"],["Heart rate","150–160"]],
          "Hold the heart rate and let the pace come to you. The pace shown is a prediction, not a target.") ];

    var wed = [
      S("6:00 PM","gym","Day 1 · legs · " + w.gym + " min",
        [["Load","4–10 reps"],["Sets",sets]],
        "The only heavy leg session of the week. Drive the bar up fast even when it moves slowly."),
      test
        ? S("7:30 PM","test","Swim time trial · 1,000 m",
            [["Target","19:10"],["Pace","1:55/100 m"]],
            "Full warm-up first. This sets every swim pace in phase 2.")
        : sThr
          ? S("7:30 PM","swim","Swim threshold · " + SWIM_SET[n],
              [["Pace",sThr + "/100 m"],["Total",s2 + " km"]],
              "Plus warm-up and cool-down. Heart rate in water runs about 10 bpm below land, so go by the clock.")
          : S("7:30 PM","swim","Aerobic swim · " + s2 + " km",
              [["Pace",swimAer(n) + "/100 m"],["Effort","continuous"]],
              "Steady, unbroken. Hold stroke count rather than chasing the clock."),
    ];

    var thu = [ (n === 3 || test)
      ? S("6:30 PM","test","FTP test · 20 min maximum",
          [["Warm-up","15 min"],["FTP","95% of the 20 min average"]],
          n === 3 ? "The number the whole plan hangs on. Go out at a pace you can hold, not one you would like to hold."
                  : "Target 275 W. Same protocol as week 3 so the comparison is clean.")
      : bSet
        ? S("6:30 PM","bike","Bike threshold · " + bSet,
            [["Power",thrW(n)],["Heart rate","170–182"],["Total",hm(w.bike[1])]],
            "On the trainer, permanently. Power first, heart rate second — heart rate lags 30 to 60 s into each rep.")
        : S("6:30 PM","bike","Aerobic ride · " + hm(w.bike[1]),
            [["Power",easyW(n)],["Heart rate","150–165"]],
            "Indoors — classes all day. Aero position for most of it.") ];

    var fri = [
      S("7:00 AM","run","Easy run · " + w.run[1] + " km",
        [["Pace","≈ " + easyRun(n) + "/km"],["Heart rate","150–160"]],
        "Short by design. This run exists for frequency, not for load."),
      S("2:00 PM","gym","Day 3 · shoulders, arms, core · " + w.gym + " min",
        [["Load","6–15 reps"],["Sets",sets]],
        "The lightest of the three and it stays that way. Saturday is tomorrow."),
      S("3:45 PM","swim","Easy technique swim · " + s3 + " km",
        [["Pace","easy"],["Set","none"]],
        "No set, no clock. Drills and feel for the water."),
    ];

    var sat = [
      S("9:00 AM","bike","Long ride · " + hm(w.bike[2]),
        [["Power",easyW(n)],["Heart rate","150–165"],["Fuel","60–80 g carb/h"]],
        "Outdoors above 5 °C and dry, otherwise Zwift. Aero position for as much of it as you can hold — that is half the point of the session."),
    ];
    if (w.run[3] > 0) sat.push(
      S("Off the bike","brick","Brick run · " + w.run[3] + " km",
        [["Pace","≈ " + longRun(n) + "/km"],["Heart rate","150–165"]],
        "Shoes laid out before you leave. Not fast — the point is the first kilometre, not the last."));

    var sun = [ test
      ? S("9:00 AM","test","10 km time trial",
          [["Target","40:30"],["Pace","4:03/km"]],
          "Replaces the long run. This sets every run pace in phase 2.")
      : S("9:00 AM","run","Long run · " + w.run[2] + " km",
          [["Pace","≈ " + longRun(n) + "/km"],["Heart rate","150–165"]],
          Math.round(w.run[2]/(w.run[0]+w.run[1]+w.run[2]+w.run[3])*100) + "% of the week's running — the long run never exceeds 30%.") ];
    sun.push(S("After","mob","Mobility · 20 min", [["Then","log the week"]], ""));

    return [
      { d:"Mon", label:"Bike, strength, swim", ses:mon },
      { d:"Tue", label: rThr ? "Run threshold" : "Aerobic run", ses:tue },
      { d:"Wed", label:"Legs and swim", ses:wed },
      { d:"Thu", label: (n===3||test) ? "FTP test" : (bSet ? "Bike threshold" : "Bike aerobic"), ses:thu },
      { d:"Fri", label:"Run, strength, swim", ses:fri },
      { d:"Sat", label:"Long ride and brick", ses:sat },
      { d:"Sun", label: test ? "10 km time trial" : "Long run", ses:sun },
    ];
  }

  // ── gym ────────────────────────────────────────────────────────────────
  var GYM = [
    { id:"Day 1", name:"Day 1 · Legs", day:"Wed", col:"var(--run)",
      note:"Wednesday, three days before the long ride and the day after the hard run. Heavy legs 24 hours before Tuesday's threshold would ruin the run, and 24 hours before Saturday would ruin the ride. Thursday's trainer session is what this costs, and it is the cheapest one to spend. Rønnestad and Mujika: 4 to 10 reps, 2 to 3 sets, 2 to 3 minutes of rest, never to failure.",
      ex:[
        ["Back squat","3 × 5–6","3 min","Brace hard, parallel depth, drive up with intent. One rep short of failure.","Maximal force in the muscles that run and pedal"],
        ["Romanian deadlift","3 × 6–8","2.5 min","Hinge at the hip, bar close, three seconds down.","Hamstring resilience and run economy"],
        ["Bulgarian split squat","3 × 8 each","2 min","Rear foot elevated, knee tracks the toe, torso upright.","Single-leg propulsion — the highest-transfer lift here"],
        ["Nordic hamstring curl","3 × 5","2 min","Lower as slowly as you can control, push back with the hands.","The one exercise with trial evidence against hamstring strains"],
        ["Single-leg calf raise","3 × 12 each","60 s","Full range, pause at the bottom stretch.","Achilles stiffness, which is run economy"],
        ["Hanging knee raise","3 × 10","60 s","No swing, curl the pelvis at the top.","Trunk stability under fatigue"],
      ]},
    { id:"Day 2", name:"Day 2 · Back, chest, core", day:"Mon", col:"var(--swim)",
      note:"Monday, between the morning ride and the swim. Upper body only, deliberately, so Tuesday's run is completely untouched. Pulling outweighs pressing because swimming is a pulling sport and you have three swims a week to support.",
      ex:[
        ["Pull-up, weighted if you can","3 × 5–6","3 min","Full hang at the bottom, elbows to the hip pockets.","Lat strength through the catch phase"],
        ["Bench press","3 × 6","2.5 min","Blades back and down, control the descent, no bounce.","Push phase of the stroke"],
        ["Chest-supported row","3 × 8","2.5 min","Chest stays on the pad, row to the low ribs.","Mid-back endurance — what holds you aero for 90 km"],
        ["Incline dumbbell press","3 × 8–10","2 min","Thirty to forty-five degrees, full stretch at the bottom.","Upper chest through the front of the stroke"],
        ["Straight-arm pulldown","3 × 12–15","75 s","Arms straight, movement at the shoulder only.","Mimics the underwater pull almost exactly"],
        ["Pallof press","3 × 10 each","60 s","Resist the rotation, do not create it. Ribs down.","Anti-rotation — what stops the hips swinging late in a run"],
        ["Dead bug","3 × 8 each","60 s","Low back pressed into the floor the whole set.","Contralateral coordination under fatigue"],
      ]},
    { id:"Day 3", name:"Day 3 · Shoulders, arms, core", day:"Fri", col:"var(--bike)",
      note:"Friday afternoon, between the morning run and Saturday's long ride. The lightest of the three and it stays that way, because Saturday is the biggest session of your week. The face pulls are not padding: three swims a week with a stroke still under construction is exactly the exposure that produces shoulder impingement.",
      ex:[
        ["Overhead press","3 × 6","2.5 min","Brace, press vertical, no lower back arch.","Shoulder strength through the recovery phase"],
        ["Single-arm dumbbell row","3 × 8 each","2 min","Flat back, row to the hip, full stretch at the bottom.","Unilateral pull — the stroke is one arm at a time"],
        ["Dips or close-grip bench","3 × 8","2 min","Elbows tucked, controlled depth, no shrug at the top.","Triceps through the finish of the pull"],
        ["Lateral raise","3 × 12–15","60 s","Pinky leads, three seconds down, lighter than your ego wants.","Deltoid balance around the joint"],
        ["Face pull","3 × 15","60 s","Pull to the forehead, rotate outward at the end, pause.","External rotators — insurance against swimmer's shoulder"],
        ["Dumbbell curl","2 × 10","60 s","No swing, full extension at the bottom.","Elbow flexor balance, kept honest at two sets"],
        ["Side plank","3 × 30–40 s each","45 s","Hips stacked and lifted, no sag.","Lateral trunk stability on the run"],
      ]},
  ];

  // ── helpers ────────────────────────────────────────────────────────────
  function el(tag, cls, html){ var e=document.createElement(tag); if(cls) e.className=cls;
    if(html!=null) e.innerHTML=html; return e; }
  function eyebrow(t){ return el("div","eyebrow",t); }
  function tableIn(host, html){ var s=el("div","scroll"); var t=el("table"); t.innerHTML=html; s.appendChild(t); host.appendChild(s); }

  // ── WEEK ───────────────────────────────────────────────────────────────
  var curWeek = 3;
  function renderWeek(){
    var host = document.getElementById("week");
    host.textContent = "";

    var sel = el("div","wsel");
    WEEKS.forEach(function(w){
      var b = el("button", w.n===curWeek?"on":"",
        '<span class="wn">'+w.n+'</span><span class="wt">'+(w.type==="load"?"load":w.type==="test"?"test":"easy")+'</span>');
      b.addEventListener("click", function(){ curWeek=w.n; renderWeek(); window.scrollTo(0,0); });
      sel.appendChild(b);
    });
    host.appendChild(sel);

    var w = WEEKS.filter(function(x){return x.n===curWeek;})[0];
    var bikeTot = w.bike[0]+w.bike[1]+w.bike[2];
    var runTot = w.run[0]+w.run[1]+w.run[2]+w.run[3];

    var head = el("div","card");
    head.appendChild(eyebrow("Week "+w.n+" of 37 · "+w.dates));
    [["Total","≈ "+w.hrs],["Swim",r1(w.swim)+" km"],["Bike",hm(bikeTot)],
     ["Run",runTot+" km"],["Gym",w.gymN+" × "+w.gym+" min"],
     ["Easy run","≈ "+easyRun(w.n)+"/km at 150–160"],["Working FTP",ftp(w.n)+" W"]].forEach(function(p){
      var r=el("div","kv"); r.appendChild(el("span","k",p[0])); r.appendChild(el("span","v",p[1])); head.appendChild(r);
    });
    head.appendChild(el("p","note",w.note));
    host.appendChild(head);

    buildWeek(w).forEach(function(d){
      var box = el("div","day");
      var h = el("div","dhead");
      h.appendChild(el("span","dname",d.d));
      h.appendChild(el("span","dlabel",d.label));
      box.appendChild(h);
      d.ses.forEach(function(s){
        var row = el("div","ses");
        row.appendChild(el("span","hh",s.h));
        var p = el("span","pill",s.t);
        p.style.background = COL[s.t];
        row.appendChild(p);
        var body = el("div","sbody");
        body.appendChild(el("div","stitle",s.title));
        if (s.targets && s.targets.length){
          var tg = el("div","starg");
          s.targets.forEach(function(x){
            tg.appendChild(el("span",null,'<span class="lab">'+x[0]+'</span> <b>'+x[1]+'</b>'));
          });
          body.appendChild(tg);
        }
        if (s.cue) body.appendChild(el("div","scue",s.cue));
        row.appendChild(body);
        box.appendChild(row);
      });
      host.appendChild(box);
    });
  }

  // ── PROGRESSION ────────────────────────────────────────────────────────
  function renderProg(){
    var host = document.getElementById("prog");
    host.textContent = "";

    var c1 = el("div","card");
    c1.appendChild(eyebrow("Week by week · where you should be"));
    var rows = "<tr><th>Wk</th><th>Easy run</th><th>Long run</th><th>Run thr</th><th>Swim aer</th><th>Swim thr</th><th>FTP</th><th class='r'>Bike thr</th></tr>";
    WEEKS.forEach(function(w){
      var cls = w.type==="deload" ? " class='dl'" : w.type==="test" ? " class='ts'" : "";
      rows += "<tr"+cls+"><td class='big'>"+w.n+"</td><td>"+easyRun(w.n)+"</td><td>"+longRun(w.n)+
        "</td><td>"+(RUN_THR[w.n]||"—")+"</td><td>"+swimAer(w.n)+"</td><td>"+(SWIM_THR[w.n]||"—")+
        "</td><td>"+ftp(w.n)+" W</td><td class='r'>"+thrW(w.n)+"</td></tr>";
    });
    tableIn(c1, rows);
    c1.appendChild(el("p","note","Run and swim paces are per kilometre and per 100 m. <b>These are predictions, not instructions.</b> What you hold constant is the heart rate; the pace is what should drift downward underneath it, and that drift is the cleanest measure of aerobic improvement you own. Ahead of the line means you are ahead of schedule. Behind it means more easy volume, not faster easy running."));
    host.appendChild(c1);

    var c2 = el("div","card");
    c2.appendChild(eyebrow("Heart rate · measured max 200"));
    tableIn(c2, "<tr><th>Band</th><th>bpm</th><th>% max</th><th class='r'>Where it appears</th></tr>" +
      "<tr><td class='big'>Recovery</td><td>under 145</td><td>&lt;73%</td><td class='r'>Shakeouts, mobility</td></tr>" +
      "<tr><td class='big'>Easy</td><td>150–160</td><td>75–80%</td><td class='r'>Tue and Fri runs</td></tr>" +
      "<tr><td class='big'>Aerobic</td><td>150–165</td><td>75–83%</td><td class='r'>All bike, long run, brick</td></tr>" +
      "<tr><td class='big'>Threshold</td><td>170–182</td><td>85–91%</td><td class='r'>All threshold work</td></tr>");
    c2.appendChild(el("p","note","Built from a measured maximum of 200, not from 220 minus your age. The threshold band is where lactate sits between 2.3 and 3.0 mmol — the range Bakken works in, deliberately below the traditional 4.0. <b>In the water, heart rate runs roughly 10 bpm lower</b> for the same effort, so swim sessions are prescribed by the pace clock, not the strap."));
    host.appendChild(c2);

    var c3 = el("div","card");
    c3.appendChild(eyebrow("Checkpoints"));
    [["Week 6 · 30 Nov","Easy running around <b>5:12/km at 155 bpm</b>. Swim threshold holding 2:00/100 m for 6 × 100 m without the last rep falling apart. If easy pace has not moved at all since week 3, the problem is almost always that your easy days are too hard."],
     ["Week 9 · 21 Dec","Easy running around <b>5:06/km at 155 bpm</b>. Bike threshold holding 95–100% of FTP for 2 × 8 min. You should be able to sit aero for 45 unbroken minutes without your neck or lower back forcing you up."],
     ["Week 12 · test block","<b>1,000 m swim in 19:10</b> (1:55/100 m) · <b>FTP 275 W</b> (3.93 W/kg) · <b>10 km in 40:30</b> (4:03/km). These three numbers write phase 2. Miss one badly and we change the plan rather than the athlete."]
    ].forEach(function(x){ c3.appendChild(el("h3",null,x[0])); c3.appendChild(el("p","chk",x[1])); });
    host.appendChild(c3);

    var c4 = el("div","card");
    c4.appendChild(eyebrow("What those numbers mean for July"));
    tableIn(c4, "<tr><th>If FTP reaches</th><th>Race power at 75%</th><th>Speed aero</th><th class='r'>90 km</th></tr>" +
      "<tr class='dl'><td>275 W · end of phase 1</td><td>206 W</td><td>37.4 km/h</td><td class='r'>2:24</td></tr>" +
      "<tr><td class='big'>290 W · end of phase 2</td><td class='big'>218 W</td><td>38.2 km/h</td><td class='r big'>2:21</td></tr>" +
      "<tr><td class='big'>300 W · race ready</td><td class='big'>225 W</td><td>38.6 km/h</td><td class='r big'>2:19</td></tr>");
    c4.appendChild(el("p","note","All three rows assume a tri-bike position at CdA 0.25. On the hoods, every one of them is roughly twenty minutes slower — which is the whole argument for getting aero bars now rather than in spring."));
    host.appendChild(c4);
  }

  // ── PHASE ──────────────────────────────────────────────────────────────
  function renderPhase(){
    var host = document.getElementById("phase");
    host.textContent = "";

    var pc = el("div","card");
    pc.appendChild(eyebrow("The 34 weeks"));
    tableIn(pc, "<tr><th>Phase</th><th>Weeks</th><th class='r'>Dates</th></tr>" +
      "<tr><td class='big'>Base completion</td><td>3–12</td><td class='r'>9 Nov – 17 Jan</td></tr>" +
      "<tr><td class='big'>Threshold build</td><td>13–24</td><td class='r'>18 Jan – 11 Apr</td></tr>" +
      "<tr><td class='big'>Race specific</td><td>25–33</td><td class='r'>12 Apr – 13 Jun</td></tr>" +
      "<tr><td class='big'>Sharpen and taper</td><td>34–37</td><td class='r'>14 Jun – 11 Jul</td></tr>");
    pc.appendChild(el("p","note","Only phase 1 is written. The three that follow are shaped by what the week 12 test block says, which is the point of testing rather than assuming."));
    host.appendChild(pc);

    var vc = el("div","card");
    vc.appendChild(eyebrow("Phase 1 volume"));
    var rows = "<tr><th>Wk</th><th>Swim</th><th>Bike</th><th>Run</th><th>Sat</th><th class='r'>Total</th></tr>";
    WEEKS.forEach(function(w){
      var bikeTot=w.bike[0]+w.bike[1]+w.bike[2], runTot=w.run[0]+w.run[1]+w.run[2]+w.run[3];
      var cls = w.type==="deload" ? " class='dl'" : w.type==="test" ? " class='ts'" : "";
      rows += "<tr"+cls+"><td class='big'>"+w.n+"</td><td>"+r1(w.swim)+" km</td><td>"+hm(bikeTot)+
        "</td><td>"+runTot+" km</td><td>"+hm(w.bike[2])+"</td><td class='r big'>"+w.hrs+"</td></tr>";
    });
    tableIn(vc, rows);
    vc.appendChild(el("p","note","Hours ramp from 11:34 to 15:41 across ten weeks — about 35% — which is why it arrives over ten weeks rather than next Monday. Grey rows are reduced weeks, the last is the test block."));
    host.appendChild(vc);

    var nc = el("div","card");
    nc.appendChild(eyebrow("Where intensity enters"));
    [["Week 5 · swim","Swimming carries no impact and almost no injury risk, so threshold starts here and nowhere earlier."],
     ["Week 7 · bike","Cycling carries no impact either, so it enters second — on the trainer, and it stays there, because the band is thirteen beats wide and Navarran roads in winter will not let you hold it."],
     ["Week 8 · run","Running is where the injuries come from, so it enters last and arrives as short repetitions rather than continuous tempo."]
    ].forEach(function(p){ nc.appendChild(el("h3",null,p[0])); nc.appendChild(el("p",null,p[1])); });
    host.appendChild(nc);
  }

  // ── TARGETS ────────────────────────────────────────────────────────────
  function renderTarget(){
    var host = document.getElementById("target");
    host.textContent = "";

    var b = el("div","card");
    b.appendChild(eyebrow("The time budget"));
    tableIn(b, "<tr><th>Leg</th><th>Simulation</th><th>Target</th><th class='r'>Gain</th></tr>" +
      "<tr><td class='big'>Swim 1.9 km</td><td>40:42</td><td>32:00</td><td class='r'>−8:42</td></tr>" +
      "<tr><td class='big'>Bike 90 km</td><td>2:36 <span style='color:#5A7080'>Zwift</span></td><td>2:18</td><td class='r'>−18:00</td></tr>" +
      "<tr><td class='big'>Run 21.1 km</td><td>1:39:59</td><td>1:30:00</td><td class='r'>−9:59</td></tr>" +
      "<tr><td class='big'>Transitions</td><td>—</td><td>5:00</td><td class='r'>—</td></tr>" +
      "<tr><td class='big'>Total</td><td class='big'>4:56:41</td><td class='big' style='color:var(--ok)'>4:25:00</td><td class='r'>—</td></tr>");
    b.appendChild(el("p","note flag","Your own three targets — 28:30, 2:30 and 1:30 — add to 4:28:30 of <b>moving</b> time. Transitions cost four to six minutes even when they go well, so hitting all three perfectly lands at 4:33:30, not under 4:30. That is why the swim target came down and the bike target went up."));
    host.appendChild(b);

    var p = el("div","card");
    p.appendChild(eyebrow("The bike, honestly"));
    p.appendChild(el("p",null,"The simulation was on Zwift. The measured number is <b>186 W</b> for 2:36 — 2.66 W/kg — confirmed by the work total of 1,753 kJ. Zwift's avatar is more aerodynamic than you are on the hoods, so your true outdoor equivalent of that ride is nearer 2:51."));
    tableIn(p, "<tr><th>186 W outdoors, flat</th><th class='r'>Speed</th><th class='r'>90 km</th></tr>" +
      "<tr><td>Road bike, hoods</td><td class='r'>31.6</td><td class='r'>2:51</td></tr>" +
      "<tr><td>Road bike, drops</td><td class='r'>33.3</td><td class='r'>2:42</td></tr>" +
      "<tr><td>Clip-on aero bars</td><td class='r'>34.4</td><td class='r'>2:37</td></tr>" +
      "<tr><td class='big'>Tri bike</td><td class='r big'>36.0</td><td class='r big'>2:30</td></tr>");
    p.appendChild(el("p","note win","Read the last row again. <b>Your 2:30 target needs no new fitness at all — only a position.</b> A tri bike at the 186 W you already hold rides 36 km/h on a flat course. The 2:18 we actually want needs about 233 W in that position: a 25% power gain over 34 weeks, which is an ordinary outcome for someone who has never trained the bike with structure."));
    p.appendChild(el("p","note","Aero time is also free time: you reach T2 having spent less, not more, which is what makes a 1:30 run plausible rather than optimistic."));
    host.appendChild(p);

    var r = el("div","card");
    r.appendChild(eyebrow("Race day notes"));
    [["July in Asunción","Southern-hemisphere winter — roughly 13 to 24 °C. You train through a Spanish summer and race somewhere mild, which is the favourable direction."],
     ["The river swim","Likely wetsuit-legal, worth another four to six seconds per 100 m to a developing swimmer. Train in it rather than meeting it on race morning."],
     ["Flat course","No climbing means no recovery from the position either. Ninety kilometres continuously aero is a demand in itself, and the only preparation is doing it."],
     ["Qualifying","World Championship slots are allocated per age group by field size, so the time that qualifies depends on who turns up in M18–24 that day. Sub-4:30 is usually competitive in that group. It is not a guarantee, and the plan is built around the time rather than the slot."]
    ].forEach(function(x){ r.appendChild(el("h3",null,x[0])); r.appendChild(el("p",null,x[1])); });
    host.appendChild(r);
  }

  // ── GYM ────────────────────────────────────────────────────────────────
  var curGym = "Day 1";
  function renderGym(){
    var host = document.getElementById("gym");
    host.textContent = "";
    var sel = el("div","wsel");
    GYM.forEach(function(g){
      var b = el("button", g.id===curGym?"on":"",
        '<span class="wn" style="font-size:11px">'+g.id.replace("Day ","D")+'</span><span class="wt">'+g.day+'</span>');
      b.style.minWidth = "62px";
      b.addEventListener("click", function(){ curGym=g.id; renderGym(); });
      sel.appendChild(b);
    });
    host.appendChild(sel);

    var g = GYM.filter(function(x){return x.id===curGym;})[0];
    var c = el("div","card");
    var h = el("h3",null,g.name); h.style.color = g.col;
    c.appendChild(h);
    c.appendChild(el("p","note",g.note));
    host.appendChild(c);

    var list = el("div","card");
    g.ex.forEach(function(e){
      var box = el("div","ex");
      var left = el("div",null); left.style.flex = "1";
      left.appendChild(el("div","exn",e[0]));
      left.appendChild(el("div","exc",e[3]));
      left.appendChild(el("div","exc",'<span style="color:'+g.col+'">→</span> '+e[4]));
      box.appendChild(left);
      var right = el("div",null); right.style.textAlign = "right";
      right.appendChild(el("div","exs",e[1]));
      right.appendChild(el("div","exc",e[2]+" rest"));
      box.appendChild(right);
      list.appendChild(box);
    });
    host.appendChild(list);
  }

  // ── METHOD ─────────────────────────────────────────────────────────────
  function renderMethod(){
    var host = document.getElementById("method");
    host.textContent = "";
    [["Keep the easy training genuinely easy",
      "The failure mode is not running too slowly, it is letting easy days drift to 170 bpm where they are too hard to recover from and too easy to drive threshold adaptation. Seiler found recreational athletes default to moderate intensity on every session because it feels productive, and it is the least effective distribution there is. Every pace in the Progression tab is a <b>prediction</b> at a fixed heart rate — hold the band, let the pace fall underneath it.",0],
     ["One threshold session per discipline, never two",
      "Tveiten on the Norwegian triathlon group: they do a great deal of double threshold, but because there are three disciplines it is always one session of each. By week 11 you carry three threshold sessions across three disciplines, and no discipline ever carries two in a day.",0],
     ["The long run is capped at 30% of the week",
      "Bakken's own base week ran 180 km and his long run never exceeded 16 to 18 km. You run 31 to 38 km a week, so your long run belongs at 8 to 11 km. It looks short for a 1:30 half and it is — the answer is more weekly volume in phase 2, not a longer Sunday now.",0],
     ["Strength is neural, not size",
      "Rønnestad and Mujika: 4 to 10 reps, 2 to 3 sets, 2 to 3 minutes of rest, two sessions a week in the preparatory period and about one in-season, never to failure. The mechanism is more force per unit of muscle and better economy. Extra upper-body mass is weight you carry for 113 km and it gives nothing back.",0],
     ["The compressed calendar, and its one real risk",
      "A 19-month build would put run threshold at week 9 of a 13-week base. You have 34 weeks to a confirmed race, so it enters at week 8, earlier than the evidence prefers. Nielsen's work points at <b>progression rate in weekly running</b> as the thing that predicts injury. If anything in your shins, achilles or hamstrings starts talking, delete the Friday run first, then the Tuesday threshold. Losing those costs very little. Losing eight weeks costs the race.",1],
     ["Three gym sessions is one more than the evidence asks for",
      "You asked for three and phase 1 has three. For phase 2 I will argue for two, because Rønnestad and Mujika found two sufficient in the preparatory period, and that third hour is worth more on the bike — which is where, on the numbers, almost all of your remaining time is.",1]
    ].forEach(function(p){
      var c = el("div","card");
      c.appendChild(el("h3",null,p[0]));
      c.appendChild(el("p", p[2] ? "note flag" : "note", p[1]));
      host.appendChild(c);
    });
  }

  // ── tabs ───────────────────────────────────────────────────────────────
  var SECTS = ["week","prog","phase","target","gym","method"];
  var renderers = { week:renderWeek, prog:renderProg, phase:renderPhase, target:renderTarget, gym:renderGym, method:renderMethod };
  var rendered = {};
  var tabs = Array.prototype.slice.call(document.querySelectorAll("nav button"));
  function show(name){
    tabs.forEach(function(b){ b.classList.toggle("on", b.dataset.t===name); });
    SECTS.forEach(function(s){ document.getElementById(s).classList.toggle("hide", s!==name); });
    if (!rendered[name]) { renderers[name](); rendered[name]=true; }
    window.scrollTo(0,0);
  }
  tabs.forEach(function(b){ b.addEventListener("click", function(){ show(b.dataset.t); }); });

  (function(){
    var race = new Date(2027,6,11);
    var days = Math.ceil((race - new Date())/86400000);
    document.getElementById("cd").textContent = days + " days · " + Math.floor(days/7) + " weeks";
  })();

  renderWeek();
})();
</script>
</body>
</html>
